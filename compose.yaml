# Lump of Coal. Copy .env.example to .env and fill it in; see README.
# Machine-specific changes (a reverse proxy's network, building from source) go in
# compose.override.yaml next to this file, which Compose picks up automatically.
services:
  lumpofcoal:
    image: ghcr.io/ogdengamer/lumpofcoal:${LUMPOFCOAL_VERSION:-latest}
    container_name: lumpofcoal
    restart: unless-stopped
    env_file: .env
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ./data:/data

  # Nightly database + photos backup (see README "Backups"). Optional: it only
  # starts when .env has COMPOSE_PROFILES=backup.
  backup:
    image: ghcr.io/ogdengamer/lumpofcoal:${LUMPOFCOAL_VERSION:-latest}
    profiles: ["backup"]
    container_name: lumpofcoal-backup
    restart: unless-stopped
    env_file: .env  # for TZ, so the backup time is local time
    command: ["python", "-m", "app.backup", "/backups",
              "--daily-at", "${BACKUP_AT:-00:30}", "--keep-days", "${BACKUP_KEEP_DAYS:-30}"]
    volumes:
      - ./data:/data  # read-write: SQLite needs its -shm file even to read
      - ${BACKUP_DIR:-./backups}:/backups
    network_mode: none
    healthcheck:
      disable: true  # the image's check is for the web app
